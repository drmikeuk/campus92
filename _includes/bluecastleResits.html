
<table class="table table-sm table-hover">
  <thead class="thead theadMid">
    <tr>
      <th scope="col">Code</th>
      <th scope="col">Title</th>
      <th scope="col">Element</th>
      <th scope="col">Resit opportunity</th>
    </tr>
  </thead>
  <tbody>
    {% for module in marks %}
    <tr>
      <td>{{ module.Code }}</td>
      <td>{{ module.Title }}</td>
      <td>{{ module.Element }}</td>  
      <td>{{ module.Resit }} {% if module.Supp %} <i class="fas fa-star"></i>{% endif %}</td> 
    </tr>
    {% endfor %}
  </tbody>
</table>
